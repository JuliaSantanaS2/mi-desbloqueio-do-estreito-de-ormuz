version: '3.8'

services:

  broker-a:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.broker
    container_name: broker-a
    environment:
      SECTOR_ID: A
      BROKER_ADDR: "0.0.0.0:7001"
      PEER_BASES: "${M2_IP}:8001"
    ports:
      - "7001:7001"
    restart: unless-stopped

  sensor-a1:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.sensor
    container_name: sensor-a1
    environment:
      SECTOR_ID: A
      SENSOR_ID: sensor-A1
      BROKER_ADDR: "broker-a:7001"
      INTERVAL_MS: "4000"
      INITIAL_DELAY_SEC: "10"
    depends_on:
      - broker-a
    restart: unless-stopped

  base-a:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.base
    container_name: base-a
    environment:
      SECTOR_ID: A
      BASE_ADDR: "0.0.0.0:8001"
      GOSSIP_ADDR: "0.0.0.0:8002"
      HB_ADDR: "0.0.0.0:8500"
      DASH_ADDR: "0.0.0.0:3001"
      PEER_BASES: "${M2_IP}:8001"
      PEER_GOSSIP: "${M2_IP}:8002"
      PEER_HB: "${M2_IP}:8500"
    ports:
      - "8001:8001"
      - "8002:8002"
      - "8500:8500/udp"
      - "3001:3001"
    restart: unless-stopped

  drone-a1:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.drone
    container_name: drone-a1
    environment:
      DRONE_ID: drone-A1
      SECTOR_ID: A
      DRONE_ADDR: "0.0.0.0:9001"
      BASE_ADDR: "base-a:8001"
      PEER_BASES: "${M2_IP}:8001"
      HB_TARGETS: "base-a:8500,${M2_IP}:8500"
    ports:
      - "9001:9001"
    depends_on:
      - base-a
    restart: unless-stopped

  dashboard-a:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.dashboard
    container_name: dashboard-a
    environment:
      SECTOR_ID: A
      BASE_DASH_ADDR: "base-a:3001"
    depends_on:
      - base-a
    stdin_open: true
    tty: true
    restart: unless-stopped

  webdash:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.webdash
    container_name: webdash
    environment:
      HTTP_ADDR: ":8080"
      BASE_ADDRS: "A=base-a:3001,B=${M2_IP}:3001"
    ports:
      - "8080:8080"
    depends_on:
      - base-a
    restart: unless-stopped
