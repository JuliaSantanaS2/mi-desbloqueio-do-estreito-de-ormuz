# PC 1 — Setor A
# Substitua PC2_IP, PC3_IP, PC4_IP pelos IPs reais dos outros PCs no laboratório.
# Exemplo: PC2_IP=192.168.1.2  PC3_IP=192.168.1.3  PC4_IP=192.168.1.4

x-peer-bases: &peer-bases "PC2_IP:8001,PC3_IP:8001,PC4_IP:8001"
x-peer-gossip: &peer-gossip "PC2_IP:8002,PC3_IP:8002,PC4_IP:8002"
x-peer-hb: &peer-hb "PC2_IP:8500,PC3_IP:8500,PC4_IP:8500"
x-peer-brokers: &peer-brokers "PC2_IP:7001,PC3_IP:7001,PC4_IP:7001"

services:

  broker-A:
    build:
      context: ..
      dockerfile: docker/Dockerfile.broker
    container_name: broker-A
    environment:
      SECTOR_ID: A
      BROKER_ADDR: "0.0.0.0:7001"
      PEER_BASES: *peer-bases
    ports:
      - "7001:7001"
    restart: unless-stopped

  sensor-A1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sensor
    container_name: sensor-A1
    environment:
      SECTOR_ID: A
      SENSOR_ID: sensor-A1
      BROKER_ADDR: "broker-A:7001"
      INTERVAL_MS: "4000"
      INITIAL_DELAY_SEC: "60"
    depends_on:
      - broker-A
    restart: unless-stopped

  sensor-A2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sensor
    container_name: sensor-A2
    environment:
      SECTOR_ID: A
      SENSOR_ID: sensor-A2
      BROKER_ADDR: "broker-A:7001"
      INTERVAL_MS: "6000"
      INITIAL_DELAY_SEC: "60"
    depends_on:
      - broker-A
    restart: unless-stopped

  base-A:
    build:
      context: ..
      dockerfile: docker/Dockerfile.base
    container_name: base-A
    environment:
      SECTOR_ID: A
      BASE_ADDR: "0.0.0.0:8001"
      GOSSIP_ADDR: "0.0.0.0:8002"
      HB_ADDR: "0.0.0.0:8500"
      DASH_ADDR: "0.0.0.0:3001"
      PEER_BASES: *peer-bases
      PEER_GOSSIP: *peer-gossip
      PEER_HB: *peer-hb
    ports:
      - "8001:8001"
      - "8002:8002"
      - "8500:8500/udp"
      - "3001:3001"
    restart: unless-stopped

  drone-A1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.drone
    container_name: drone-A1
    environment:
      DRONE_ID: drone-A1
      SECTOR_ID: A
      DRONE_ADDR: "0.0.0.0:9001"
      BASE_ADDR: "base-A:8001"
      PEER_BASES: *peer-bases
      HB_TARGETS: "base-A:8500,PC2_IP:8500,PC3_IP:8500,PC4_IP:8500"
    ports:
      - "9001:9001"
    depends_on:
      - base-A
    restart: unless-stopped

  dashboard-A:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: dashboard-A
    environment:
      SECTOR_ID: A
      BASE_DASH_ADDR: "base-A:3001"
    depends_on:
      - base-A
    # Dashboard é interativo — abre em terminal separado com:
    # docker attach dashboard-A
    stdin_open: true
    tty: true
    restart: unless-stopped
