# docker-compose.local.yml — TESTE EM UMA ÚNICA MÁQUINA
#
# Simula os 4 PCs do laboratório em uma única máquina usando portas diferentes.
# Cada setor usa um offset de porta:
#   Setor A: 7001, 8001, 8002, 8500, 3001, 9001
#   Setor B: 7011, 8011, 8012, 8510, 3011, 9011
#   Setor C: 7021, 8021, 8022, 8520, 3021, 9021
#   Setor D: 7031, 8031, 8032, 8530, 3031, 9031
#
# Como usar:
#   docker compose -f deploy/docker-compose.local.yml up --build
#
# Ver dashboard de um setor (em terminal separado):
#   docker attach dashboard-A
#   docker attach dashboard-B
#   docker attach dashboard-C
#   docker attach dashboard-D
#
# Adicionar drone extra em runtime (exemplo: novo drone no setor A):
#   docker compose -f deploy/docker-compose.local.yml run --rm \
#     -e DRONE_ID=drone-A2 -e DRONE_ADDR=0.0.0.0:9002 -e BASE_ADDR=localhost:8001 \
#     drone-base
#
# Simular queda de um setor (exemplo: derruba setor B):
#   docker compose -f deploy/docker-compose.local.yml stop broker-B base-B drone-B1
#
# Restaurar setor derrubado:
#   docker compose -f deploy/docker-compose.local.yml start broker-B base-B drone-B1

services:

  # ══════════════════════════════════════════════════════
  # SETOR A  (simula PC 1)
  # ══════════════════════════════════════════════════════

  broker-A:
    build:
      context: ..
      dockerfile: docker/Dockerfile.broker
    container_name: broker-A
    environment:
      SECTOR_ID: A
      BROKER_ADDR: "0.0.0.0:7001"
      PEER_BASES: "localhost:8011,localhost:8021,localhost:8031"
    ports:
      - "7001:7001"
    restart: unless-stopped

  sensor-A1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sensor
    container_name: sensor-A1
    network_mode: host
    environment:
      SECTOR_ID: A
      SENSOR_ID: sensor-A1
      BROKER_ADDR: "localhost:7001"
      PEER_BROKERS: "localhost:7011,localhost:7021,localhost:7031"
      INTERVAL_MS: "4000"
      INITIAL_DELAY_SEC: "60"
    depends_on:
      - broker-A
    restart: unless-stopped

  sensor-A2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sensor
    container_name: sensor-A2
    network_mode: host
    environment:
      SECTOR_ID: A
      SENSOR_ID: sensor-A2
      BROKER_ADDR: "localhost:7001"
      PEER_BROKERS: "localhost:7011,localhost:7021,localhost:7031"
      INTERVAL_MS: "7000"
      INITIAL_DELAY_SEC: "60"
    depends_on:
      - broker-A
    restart: unless-stopped

  base-A:
    build:
      context: ..
      dockerfile: docker/Dockerfile.base
    container_name: base-A
    network_mode: host
    environment:
      SECTOR_ID: A
      BASE_ADDR: "0.0.0.0:8001"
      GOSSIP_ADDR: "0.0.0.0:8002"
      HB_ADDR: "0.0.0.0:8500"
      DASH_ADDR: "0.0.0.0:3001"
      PEER_BASES: "localhost:8011,localhost:8021,localhost:8031"
      PEER_GOSSIP: "localhost:8012,localhost:8022,localhost:8032"
      PEER_HB: "localhost:8510,localhost:8520,localhost:8530"
    restart: unless-stopped

  drone-A1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.drone
    container_name: drone-A1
    network_mode: host
    environment:
      DRONE_ID: drone-A1
      SECTOR_ID: A
      DRONE_ADDR: "0.0.0.0:9001"
      BASE_ADDR: "localhost:8001"
      PEER_BASES: "localhost:8011,localhost:8021,localhost:8031"
      HB_TARGETS: "localhost:8500,localhost:8510,localhost:8520,localhost:8530"
    depends_on:
      - base-A
    restart: unless-stopped

  dashboard-A:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: dashboard-A
    network_mode: host
    environment:
      SECTOR_ID: A
      BASE_DASH_ADDR: "localhost:3001"
    depends_on:
      - base-A
    stdin_open: true
    tty: true
    restart: unless-stopped

